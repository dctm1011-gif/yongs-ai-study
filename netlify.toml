[build]
  command = "echo 'Build complete'"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Scheduled function: Update Firebase every minute
[[functions]]
path = "netlify/functions/monitoring-test.mjs"
schedule = "* * * * *"

# Investment API routes
[[redirects]]
from = "/api/investment/*"
to = "/.netlify/functions/investment"
status = 200
force = true

# General API routes
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200
