[build]
  command = "node -e \"process.exit(0)\""
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".claude,english/push_daily_to_firebase.py"
  NPM_FLAGS = "--ignore-scripts"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# General API routes
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200
