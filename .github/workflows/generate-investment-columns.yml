name: Generate Investment Columns Daily

on:
  schedule:
    - cron: '15 6 * * *'  # 매일 06:15 UTC (15:15 KST) - english와 push 충돌 방지
  workflow_dispatch:     # 수동 트리거

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic

      - name: Generate columns
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_columns.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add netlify/data/columns.json

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-generate daily investment columns $(date +%Y-%m-%d)"
            git push
          fi
