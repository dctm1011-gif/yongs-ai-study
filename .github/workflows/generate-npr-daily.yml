name: Fetch NPR News Now

on:
  workflow_dispatch:  # 스케줄 비활성화 (generate-podcast-daily.yml로 대체)

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch NPR episode and push to Firebase
        run: python scripts/generate_npr_daily.py
