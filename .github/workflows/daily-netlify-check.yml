name: Daily Netlify Health Check

on:
  schedule:
    # 매일 오전 6:30 (배포 스크립트 후)
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: daily-netlify-check
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Netlify monitoring
        run: python3 .github/scripts/monitor-netlify.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-monitoring-report
          path: netlify-monitoring-report.json
          retention-days: 90

      - name: Notify Slack on failure
        if: failure()
        run: |
          echo "⚠️ Netlify monitoring failed. Check the report."
