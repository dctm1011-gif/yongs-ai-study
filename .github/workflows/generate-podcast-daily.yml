name: Fetch Learning English Podcasts

on:
  # 스케줄 비활성화 — Netlify podcast-daily.mjs가 대신 실행 (2026-08-25)
  # schedule:
  #   - cron: '0 1 * * *'   # 10:00 KST
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install anthropic

      - name: Fetch podcasts and push to Firebase
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_podcast_daily.py
