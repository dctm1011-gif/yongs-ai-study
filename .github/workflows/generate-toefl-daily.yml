name: Generate Daily TOEFL Content

on:
  schedule:
    - cron: '30 6 * * *'  # 매일 06:30 UTC (15:30 KST) - english/investment push 충돌 방지
  workflow_dispatch:     # 수동 실행 가능

concurrency:
  group: generate-toefl-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install anthropic

      - name: Generate daily TOEFL content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_toefl_daily.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add toefl/daily.json
          git diff --cached --quiet || git commit -m "chore: generate daily TOEFL content"
          git push origin HEAD:main

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=toefl
