name: Generate Daily TOEFL Content

on:
  # 자동 실행 중단 (2026-09-18) — 만들어 둔 문제를 보던 toefl/index.html에
  # 더 이상 들어가지 않는다. 읽는 데가 없어서 매일 토큰만 나가던 상태였다.
  # 되살리려면 아래 schedule 주석을 풀 것. 수동 실행은 그대로 가능하다.
  # schedule:
  #   - cron: '30 6 * * *'  # 매일 06:30 UTC (15:30 KST)
  workflow_dispatch:     # 수동 실행 가능

concurrency:
  group: generate-toefl-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install anthropic

      - name: Generate daily TOEFL content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_toefl_daily.py

      - name: Commit and push changes
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add toefl/daily.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: generate daily TOEFL content"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=toefl
