name: Test Netlify Functions

on:
  push:
    paths:
      - 'netlify/functions/**'
      - 'netlify.toml'
      - '.github/workflows/test-netlify.yml'
  schedule:
    # 매일 오전 6시 (한국시간: 오후 3시)
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: test-netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for Netlify deployment
        run: |
          echo "⏳ Polling Netlify until it responds..."
          BASE="https://illustrious-cuchufli-7c4e58.netlify.app"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/.netlify/functions/test" --max-time 10 || echo "000")
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "✅ Netlify responded (HTTP $STATUS) after $i attempt(s)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "⚠️ Netlify did not become ready in time, proceeding anyway"

      - name: Test Netlify Functions
        run: node .github/scripts/test-netlify-functions.mjs

      - name: Generate report
        if: always()
        run: |
          echo "📋 Netlify Functions Test Report" > netlify-test-report.md
          echo "Date: $(date)" >> netlify-test-report.md
          echo "Status: ${{ job.status }}" >> netlify-test-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-test-report
          path: netlify-test-report.md
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Netlify Functions test failed!"
          echo "Check the test report for details."
          exit 1
