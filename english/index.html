<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영어공부 — 2026-07-29</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #fff;
  color: #37352f;
  font-size: 15px;
  line-height: 1.6;
}
.cover {
  height: 8px;
  background: linear-gradient(90deg, #0ea5e9 0%, #6366f1 100%);
}
.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #9b9a97;
  text-decoration: none;
  margin-bottom: 24px;
}
.back-link:hover { color: #37352f; }
.page-icon { font-size: 48px; margin-bottom: 10px; display: block; }
.page-title { font-size: 30px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
.page-desc { font-size: 13px; color: #9b9a97; margin-bottom: 28px; }
.date-badge {
  display: inline-block;
  font-size: 11px;
  background: #eff6ff;
  color: #3b82f6;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 600;
  margin-bottom: 28px;
}
/* 탭 */
.tab-bar {
  display: flex;
  gap: 4px;
  border-bottom: 2px solid #e9e9e7;
  margin-bottom: 28px;
}
.tab-btn {
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  color: #9b9a97;
  border: none;
  background: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color .15s;
}
.tab-btn.active { color: #37352f; border-bottom-color: #37352f; }
.tab-btn:hover:not(.active) { color: #37352f; }
.tab-btn { transition: color .15s; }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: tabIn .2s ease; }
@keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* 단어 카드 */
.word-list { display: flex; flex-direction: column; gap: 16px; }
.word-card {
  border: 1px solid #e9e9e7;
  border-radius: 10px;
  padding: 20px;
  transition: box-shadow .15s;
}
.word-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.08); }
.word-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.word-text {
  font-size: 22px;
  font-weight: 700;
  color: #37352f;
}
.word-pos {
  font-size: 11px;
  background: #f1f0ef;
  color: #9b9a97;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
}
.word-meaning {
  font-size: 17px;
  font-weight: 600;
  color: #0ea5e9;
  margin-bottom: 8px;
}
.word-explanation { font-size: 14px; color: #37352f; margin-bottom: 12px; line-height: 1.6; }
.example-box {
  background: #f7f6f3;
  border-left: 3px solid #0ea5e9;
  border-radius: 0 6px 6px 0;
  padding: 10px 14px;
  margin-bottom: 10px;
}
.example-en { font-size: 14px; font-style: italic; color: #37352f; margin-bottom: 3px; }
.example-ko { font-size: 12px; color: #9b9a97; }
.tip-box {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 13px;
  color: #92400e;
  margin-bottom: 12px;
}
.tip-label { font-weight: 700; margin-right: 4px; }
.word-illus {
  border-radius: 14px;
  padding: 24px 20px;
  text-align: center;
  margin-top: 14px;
}
.word-illus-emoji {
  font-size: 54px;
  display: block;
  margin-bottom: 8px;
}
.word-illus-en {
  font-size: 20px;
  font-weight: 800;
  color: white;
  margin-bottom: 4px;
  text-shadow: 0 1px 4px rgba(0,0,0,.25);
}
.word-illus-ko {
  font-size: 13px;
  color: rgba(255,255,255,.88);
  font-weight: 500;
}
.quiz-illus {
  border-radius: 10px;
  padding: 14px 16px;
  text-align: center;
  margin-bottom: 10px;
}
.finish-stats {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin: 14px 0;
}
.finish-stat { text-align: center; }
.finish-stat-num { font-size: 26px; font-weight: 700; color: #166534; }
.finish-stat-label { font-size: 11px; color: #9b9a97; }
.finish-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 16px;
  flex-wrap: wrap;
}
.finish-btn-review {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 700;
  background: linear-gradient(135deg, #8b5cf6, #06b6d4);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
.finish-btn-retry {
  padding: 10px 20px;
  font-size: 14px;
  color: #9b9a97;
  background: #f7f6f3;
  border: 1px solid #e9e9e7;
  border-radius: 8px;
  cursor: pointer;
}
/* 퀴즈 */
.quiz-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.quiz-score {
  font-size: 13px;
  color: #9b9a97;
}
.score-num { font-weight: 700; color: #37352f; font-size: 16px; }
.btn-reset {
  font-size: 13px;
  color: #9b9a97;
  background: #f7f6f3;
  border: 1px solid #e9e9e7;
  border-radius: 6px;
  padding: 5px 12px;
  cursor: pointer;
}
.btn-reset:hover { background: #e9e9e7; }
.quiz-list { display: flex; flex-direction: column; gap: 20px; }
.quiz-card {
  border: 1px solid #e9e9e7;
  border-radius: 10px;
  padding: 20px;
}
.quiz-card.answered { background: #fafaf9; }
.quiz-type-badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: #9b9a97;
  margin-bottom: 8px;
}
.quiz-word-badge {
  display: inline-block;
  font-size: 11px;
  background: #eff6ff;
  color: #3b82f6;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  margin-bottom: 10px;
}
.quiz-question { font-size: 15px; font-weight: 600; color: #37352f; margin-bottom: 14px; }
.quiz-options { display: flex; flex-direction: column; gap: 8px; }
.opt-btn {
  text-align: left;
  background: #f7f6f3;
  border: 1px solid #e9e9e7;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px;
  cursor: pointer;
  transition: background .1s, border-color .1s;
  color: #37352f;
}
.opt-btn:hover:not(:disabled) { background: #eff6ff; border-color: #93c5fd; }
.opt-btn.correct { background: #f0fdf4; border-color: #86efac; color: #166534; }
.opt-btn.wrong { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
.fill-input {
  width: 100%;
  border: 1px solid #e9e9e7;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: inherit;
  color: #37352f;
  outline: none;
  transition: border-color .15s;
  margin-bottom: 8px;
}
.fill-input:focus { border-color: #0ea5e9; }
.fill-input.correct { border-color: #86efac; background: #f0fdf4; }
.fill-input.wrong { border-color: #fca5a5; background: #fef2f2; }
.btn-submit {
  background: #0ea5e9;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.btn-submit:hover { background: #0284c7; }
.btn-submit:disabled { background: #e9e9e7; color: #9b9a97; cursor: default; }
.quiz-explanation {
  display: none;
  margin-top: 12px;
  padding: 10px 14px;
  background: #f7f6f3;
  border-radius: 6px;
  font-size: 13px;
  color: #37352f;
  line-height: 1.6;
}
.quiz-explanation.show { display: block; }
.expl-label { font-weight: 700; color: #0ea5e9; }
.hint-text { font-size: 12px; color: #9b9a97; margin-bottom: 6px; }
.progress-bar-wrap {
  background: #f1f0ef;
  border-radius: 4px;
  height: 6px;
  margin-bottom: 24px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #0ea5e9, #6366f1);
  border-radius: 4px;
  transition: width .4s ease;
}
.finish-banner {
  display: none;
  text-align: center;
  padding: 28px;
  border: 2px solid #86efac;
  border-radius: 12px;
  background: #f0fdf4;
  margin-bottom: 24px;
}
.finish-banner.show { display: block; }
.finish-emoji { font-size: 40px; margin-bottom: 8px; }
.finish-title { font-size: 18px; font-weight: 700; color: #166534; margin-bottom: 4px; }
.finish-sub { font-size: 14px; color: #4ade80; }
.vocab-done-wrap {
  text-align: center;
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid #e9e9e7;
}
.btn-vocab-done {
  padding: 12px 36px;
  font-size: 15px;
  font-weight: 700;
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  color: #fff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-vocab-done:hover { opacity: .9; }
.btn-vocab-done.done {
  background: #f0fdf4;
  color: #166534;
  border: 2px solid #86efac;
  cursor: default;
}
@media (max-width: 500px) {
  .page { padding: 32px 16px 60px; }
  .page-title { font-size: 24px; }
}
</style>
</head>

<div class="cover"></div>
<div class="page">

    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="quiz-list" id="quizList"></div>
  </div>

</div>

<script>
const WORDS = [{"word": "aesthetic", "part_of_speech": "adjective", "meaning_ko": "미적인, 미학적인", "explanation": "Something that is pleasing to look at or related to beauty and art. Often used to describe a visual style or design approach.", "example_from_convo": "The minimalist aesthetic of her apartment is so calming", "example_ko": "그녀의 아파트의 미니멀리스트 미학이 정말 차분해", "tip": "Social media와 디자인에서 매우 자주 사용되는 현대적인 표현", "emoji": "🎨"}, {"word": "complacent", "part_of_speech": "adjective", "meaning_ko": "자만하는, 만족하는", "explanation": "Being satisfied with yourself or your situation in a way that prevents improvement; self-satisfied without awareness of potential dangers or problems.", "example_from_convo": "Don't become complacent after one success; keep pushing forward", "example_ko": "한 번의 성공 후에 자만하지 말고 계속 나아가", "tip": "부정적인 뉘앙스를 가지고 있으므로 주의해서 사용할 것", "emoji": "😏"}, {"word": "deluge", "part_of_speech": "noun", "meaning_ko": "폭주, 대량, 홍수", "explanation": "A large amount of something that comes suddenly or continuously; can refer to literal flooding or figurative overwhelming amounts of information, messages, etc.", "example_from_convo": "I received a deluge of emails after the announcement", "example_ko": "공지 후에 대량의 이메일을 받았어", "tip": "물리적인 홍수뿐만 아니라 정보나 메시지의 과다함을 표현할 때도 사용", "emoji": "🌊"}, {"word": "indigenous", "part_of_speech": "adjective", "meaning_ko": "토착의, 원주민의", "explanation": "Originating or occurring naturally in a particular place; native. Often used to describe plants, animals, or peoples that are native to a region.", "example_from_convo": "The indigenous peoples of Australia have a rich cultural heritage", "example_ko": "호주의 토착민들은 풍부한 문화 유산을 가지고 있다", "tip": "역사, 문화, 생물학 등 다양한 분야의 학문에서 중요한 용어", "emoji": "🌿"}, {"word": "ostracize", "part_of_speech": "verb", "meaning_ko": "따돌리다, 추방하다", "explanation": "To exclude someone from a group or society as a punishment or rejection; to deliberately ignore or isolate someone socially.", "example_from_convo": "The group began to ostracize him after he broke their trust", "example_ko": "그가 신뢰를 배반한 후 그 그룹은 그를 따돌리기 시작했다", "tip": "사회적 배제나 집단 따돌림을 표현할 때 사용되는 학문적 표현", "emoji": "🚫"}];
const QUIZ  = [{"type": "meaning", "word": "aesthetic", "question": "What does 'aesthetic' primarily refer to?", "options": ["Related to beauty, art, or visual design", "Related to science and mathematics", "Related to physical strength", "Related to financial matters"], "answer": 0, "explanation": "Aesthetic pertains to beauty, art, and visual design. It describes something that is pleasing to look at or related to artistic expression."}, {"type": "meaning", "word": "deluge", "question": "Which of the following best describes a 'deluge'?", "options": ["A small, controlled amount", "A large, overwhelming amount of something", "A temporary pause", "A careful selection"], "answer": 1, "explanation": "A deluge refers to a large amount of something that comes suddenly or continuously, overwhelming the recipient."}, {"type": "meaning", "word": "ostracize", "question": "To ostracize someone means to:", "options": ["Promote someone to a higher position", "Help someone integrate into a group", "Exclude or isolate someone from a group", "Educate someone about social norms"], "answer": 2, "explanation": "To ostracize means to deliberately exclude, ignore, or isolate someone from a group as punishment or rejection."}, {"type": "fill_blank", "word": "complacent", "question": "After winning the championship, the team became _____ and didn't train as hard.", "options": ["complacent", "diligent", "inquisitive", "meticulous"], "answer": 0, "explanation": "Complacent fits perfectly here, meaning the team became self-satisfied and stopped putting in effort after their success."}, {"type": "fill_blank", "word": "indigenous", "question": "The _____ plants of this rainforest have been used for centuries in traditional medicine.", "options": ["imported", "foreign", "indigenous", "rare"], "answer": 2, "explanation": "Indigenous means native to a particular place, so indigenous plants are those naturally occurring in the rainforest."}, {"type": "fill_blank", "word": "deluge", "question": "The company was hit with a _____ of complaints after the product recall announcement.", "options": ["shortage", "deluge", "trickle", "silence"], "answer": 1, "explanation": "Deluge is the correct choice, referring to the large, overwhelming number of complaints the company received."}, {"type": "situation", "word": "complacent", "question": "A student gets a 95% on their first exam and stops studying for the rest of the semester. Their friend warns them not to become _____. What word should fill the blank?", "options": ["motivated", "complacent", "ambitious", "dedicated"], "answer": 1, "explanation": "Complacent is the correct answer. The student has become self-satisfied with one good result and is no longer making effort, which is exactly what complacency means."}, {"type": "situation", "word": "ostracize", "question": "In a workplace, a colleague who reported unethical behavior finds that no one talks to them, invites them to meetings, or includes them in group activities. What is happening to this person?", "options": ["They are being promoted", "They are being mentored", "They are being ostracized", "They are being trained"], "answer": 2, "explanation": "The colleague is being ostracized—deliberately excluded and isolated from the group as social punishment, even though their actions were ethical."}];

/* ── 탭 전환 ── */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

/* ── 단어 카드 그라디언트 ── */
function wordGradient(pos) {
  const p = (pos || '').toLowerCase();
  if (p.includes('슬랭') || p.includes('slang') || p.includes('구동사'))
    return 'linear-gradient(135deg,#7c3aed,#4f46e5)';
  if (p.includes('동사') || p.includes('verb'))
    return 'linear-gradient(135deg,#0ea5e9,#2563eb)';
  if (p.includes('형용사') || p.includes('adj'))
    return 'linear-gradient(135deg,#10b981,#059669)';
  if (p.includes('명사') || p.includes('noun'))
    return 'linear-gradient(135deg,#f59e0b,#dc2626)';
  if (p.includes('관용') || p.includes('idiom') || p.includes('표현'))
    return 'linear-gradient(135deg,#ec4899,#8b5cf6)';
  if (p.includes('부사'))
    return 'linear-gradient(135deg,#06b6d4,#0284c7)';
  return 'linear-gradient(135deg,#6366f1,#8b5cf6)';
}

/* ── 단어 탭 렌더 ── */
function renderWords() {
  const list = document.getElementById('wordList');
  list.innerHTML = WORDS.map((w, i) => `
    <div class="word-card">
      <div class="word-header">
        <span class="word-text">${w.word}</span>
        <span class="word-pos">${w.part_of_speech}</span>
      </div>
      <div class="word-meaning">${w.meaning_ko}</div>
      <div class="word-explanation">${w.explanation}</div>
      ${w.example_from_convo ? `
      <div class="example-box">
        <div class="example-en">"${w.example_from_convo}"</div>
        <div class="example-ko">${w.example_ko}</div>
      </div>` : ''}
      ${w.tip ? `
      <div class="tip-box">
        <span class="tip-label">💡 Tip</span>${w.tip}
      </div>` : ''}
      ${w.emoji ? `
      <div class="word-illus" style="background:${wordGradient(w.part_of_speech)}">
        <span class="word-illus-emoji">${w.emoji}</span>
        <div class="word-illus-en">${w.word}</div>
        <div class="word-illus-ko">${w.meaning_ko}</div>
      </div>` : ''}
    </div>
  `).join('');
}

/* ── 퀴즈 탭 렌더 ── */
let score = 0;
let answered = 0;

function renderQuiz() {
  document.getElementById('totalDisplay').textContent = QUIZ.length;
  const list = document.getElementById('quizList');
  list.innerHTML = QUIZ.map((q, i) => buildQuizCard(q, i)).join('');
}

function buildQuizCard(q, i) {
  const typeLabel = { meaning: '의미 퀴즈', fill_blank: '빈칸 채우기', situation: '상황 퀴즈' }[q.type] || q.type;
  const wordBadge = q.word ? `<span class="quiz-word-badge">${q.word}</span><br>` : '';
  const wd = WORDS.find(w => w.word === q.word);
  const illustHtml = (wd && wd.emoji) ? `
    <div class="quiz-illus" style="background:${wordGradient(wd.part_of_speech)};margin-bottom:10px">
      <span style="font-size:36px">${wd.emoji}</span>
      <div style="font-size:15px;font-weight:800;color:white;margin-top:5px;text-shadow:0 1px 3px rgba(0,0,0,.2)">${wd.word}</div>
      <div style="font-size:12px;color:rgba(255,255,255,.85)">${wd.meaning_ko}</div>
    </div>` : '';

  if (q.type === 'fill_blank') {
    return `
    <div class="quiz-card" id="qcard-${i}">
      <div class="quiz-type-badge">${typeLabel}</div>
      ${wordBadge}
      <div class="quiz-question">${q.sentence}</div>
      ${q.sentence_ko ? `<div class="hint-text">${q.sentence_ko}</div>` : ''}
      <div class="hint-text">힌트: ${q.hint}</div>
      <input class="fill-input" id="fill-${i}" placeholder="답을 입력하세요" onkeydown="if(event.key==='Enter') submitFill(${i})">
      <button class="btn-submit" id="fill-btn-${i}" onclick="submitFill(${i})">제출</button>
      <div class="quiz-explanation" id="expl-${i}">
        ${illustHtml}
        <span class="expl-label">정답: </span>${q.answer}
      </div>
    </div>`;
  }

  const opts = (q.options || []).map((opt, j) =>
    `<button class="opt-btn" id="opt-${i}-${j}" onclick="selectOpt(${i}, ${j}, ${q.answer})">${String.fromCharCode(65+j)}. ${opt}</button>`
  ).join('');

  return `
  <div class="quiz-card" id="qcard-${i}">
    <div class="quiz-type-badge">${typeLabel}</div>
    ${wordBadge}
    <div class="quiz-question">${q.question}</div>
    <div class="quiz-options">${opts}</div>
    <div class="quiz-explanation" id="expl-${i}">
      ${illustHtml}
      <span class="expl-label">💬 </span>${q.explanation || ''}
    </div>
  </div>`;
}

function selectOpt(qi, chosen, correct) {
  const card = document.getElementById('qcard-' + qi);
  if (card.classList.contains('answered')) return;
  card.classList.add('answered');
  answered++;

  const opts = card.querySelectorAll('.opt-btn');
  opts.forEach(b => b.disabled = true);
  opts[correct].classList.add('correct');
  if (chosen !== correct) opts[chosen].classList.add('wrong');
  else { score++; document.getElementById('scoreDisplay').textContent = score; }

  document.getElementById('expl-' + qi).classList.add('show');
  updateProgress();
}

function submitFill(qi) {
  const inp = document.getElementById('fill-' + qi);
  const btn = document.getElementById('fill-btn-' + qi);
  const card = document.getElementById('qcard-' + qi);
  if (card.classList.contains('answered')) return;

  const userAns = inp.value.trim().toLowerCase();
  const correct = QUIZ[qi].answer.toLowerCase();
  card.classList.add('answered');
  answered++;
  inp.disabled = true;
  btn.disabled = true;

  if (userAns === correct) { inp.classList.add('correct'); score++; document.getElementById('scoreDisplay').textContent = score; }
  else { inp.classList.add('wrong'); }

  document.getElementById('expl-' + qi).classList.add('show');
  updateProgress();
}

function updateProgress() {
  const pct = QUIZ.length ? (answered / QUIZ.length * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  if (answered === QUIZ.length) showFinish();
}

function showFinish() {
  const banner = document.getElementById('finishBanner');
  const wrong = answered - score;
  const pct = Math.round(score / QUIZ.length * 100);
  document.getElementById('finishEmoji').textContent = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '📖';
  document.getElementById('finishTitle').textContent = pct >= 80 ? '완벽해요!' : pct >= 50 ? '잘하고 있어요!' : '계속 연습하면 돼요!';
  document.getElementById('finishSub').textContent = '오늘 배운 표현들 퀴즈 완료!';
  document.getElementById('finishCorrect').textContent = score;
  document.getElementById('finishWrong').textContent = wrong;
  document.getElementById('finishAccuracy').textContent = pct + '%';
  banner.classList.add('show');
  banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
  localStorage.setItem('english_quiz_done', TODAY_DATE);
}

function resetQuiz() {
  score = 0;
  answered = 0;
  document.getElementById('scoreDisplay').textContent = 0;
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('finishBanner').classList.remove('show');
  renderQuiz();
}

renderWords();
renderQuiz();

const TODAY_DATE = (()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
function markVocabDone() {
  localStorage.setItem('english_vocab_read', TODAY_DATE);
  const btn = document.getElementById('btnVocabDone');
  btn.textContent = '✅ 오늘 완료!';
  btn.className = 'btn-vocab-done done';
  btn.disabled = true;
}
(function() {
  if (localStorage.getItem('english_vocab_read') === TODAY_DATE) {
    const btn = document.getElementById('btnVocabDone');
    btn.textContent = '✅ 오늘 완료!';
    btn.className = 'btn-vocab-done done';
    btn.disabled = true;
  }
})();
</script>
