<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영어공부 — 2026-07-31</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #fff;
  color: #37352f;
  font-size: 15px;
  line-height: 1.6;
}
.cover {
  height: 8px;
  background: linear-gradient(90deg, #0ea5e9 0%, #6366f1 100%);
}
.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #9b9a97;
  text-decoration: none;
  margin-bottom: 24px;
}
.back-link:hover { color: #37352f; }
.page-icon { font-size: 48px; margin-bottom: 10px; display: block; }
.page-title { font-size: 30px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
.page-desc { font-size: 13px; color: #9b9a97; margin-bottom: 28px; }
.date-badge {
  display: inline-block;
  font-size: 11px;
  background: #eff6ff;
  color: #3b82f6;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 600;
  margin-bottom: 28px;
}
/* 탭 */
.tab-bar {
  display: flex;
  gap: 4px;
  border-bottom: 2px solid #e9e9e7;
  margin-bottom: 28px;
}
.tab-btn {
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  color: #9b9a97;
  border: none;
  background: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color .15s;
}
.tab-btn.active { color: #37352f; border-bottom-color: #37352f; }
.tab-btn:hover:not(.active) { color: #37352f; }
.tab-btn { transition: color .15s; }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: tabIn .2s ease; }
@keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* 단어 카드 */
.word-list { display: flex; flex-direction: column; gap: 16px; }
.word-card {
  border: 1px solid #e9e9e7;
  border-radius: 10px;
  padding: 20px;
  transition: box-shadow .15s;
}
.word-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.08); }
.word-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.word-text {
  font-size: 22px;
  font-weight: 700;
  color: #37352f;
}
.word-pos {
  font-size: 11px;
  background: #f1f0ef;
  color: #9b9a97;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
}
.word-meaning {
  font-size: 17px;
  font-weight: 600;
  color: #0ea5e9;
  margin-bottom: 8px;
}
.word-explanation { font-size: 14px; color: #37352f; margin-bottom: 12px; line-height: 1.6; }
.example-box {
  background: #f7f6f3;
  border-left: 3px solid #0ea5e9;
  border-radius: 0 6px 6px 0;
  padding: 10px 14px;
  margin-bottom: 10px;
}
.example-en { font-size: 14px; font-style: italic; color: #37352f; margin-bottom: 3px; }
.example-ko { font-size: 12px; color: #9b9a97; }
.tip-box {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 13px;
  color: #92400e;
  margin-bottom: 12px;
}
.tip-label { font-weight: 700; margin-right: 4px; }
.word-illus {
  border-radius: 14px;
  padding: 24px 20px;
  text-align: center;
  margin-top: 14px;
}
.word-illus-emoji {
  font-size: 54px;
  display: block;
  margin-bottom: 8px;
}
.word-illus-en {
  font-size: 20px;
  font-weight: 800;
  color: white;
  margin-bottom: 4px;
  text-shadow: 0 1px 4px rgba(0,0,0,.25);
}
.word-illus-ko {
  font-size: 13px;
  color: rgba(255,255,255,.88);
  font-weight: 500;
}
.quiz-illus {
  border-radius: 10px;
  padding: 14px 16px;
  text-align: center;
  margin-bottom: 10px;
}
.finish-stats {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin: 14px 0;
}
.finish-stat { text-align: center; }
.finish-stat-num { font-size: 26px; font-weight: 700; color: #166534; }
.finish-stat-label { font-size: 11px; color: #9b9a97; }
.finish-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 16px;
  flex-wrap: wrap;
}
.finish-btn-review {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 700;
  background: linear-gradient(135deg, #8b5cf6, #06b6d4);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
.finish-btn-retry {
  padding: 10px 20px;
  font-size: 14px;
  color: #9b9a97;
  background: #f7f6f3;
  border: 1px solid #e9e9e7;
  border-radius: 8px;
  cursor: pointer;
}
/* 퀴즈 */
.quiz-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.quiz-score {
  font-size: 13px;
  color: #9b9a97;
}
.score-num { font-weight: 700; color: #37352f; font-size: 16px; }
.btn-reset {
  font-size: 13px;
  color: #9b9a97;
  background: #f7f6f3;
  border: 1px solid #e9e9e7;
  border-radius: 6px;
  padding: 5px 12px;
  cursor: pointer;
}
.btn-reset:hover { background: #e9e9e7; }
.quiz-list { display: flex; flex-direction: column; gap: 20px; }
.quiz-card {
  border: 1px solid #e9e9e7;
  border-radius: 10px;
  padding: 20px;
}
.quiz-card.answered { background: #fafaf9; }
.quiz-type-badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: #9b9a97;
  margin-bottom: 8px;
}
.quiz-word-badge {
  display: inline-block;
  font-size: 11px;
  background: #eff6ff;
  color: #3b82f6;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  margin-bottom: 10px;
}
.quiz-question { font-size: 15px; font-weight: 600; color: #37352f; margin-bottom: 14px; }
.quiz-options { display: flex; flex-direction: column; gap: 8px; }
.opt-btn {
  text-align: left;
  background: #f7f6f3;
  border: 1px solid #e9e9e7;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px;
  cursor: pointer;
  transition: background .1s, border-color .1s;
  color: #37352f;
}
.opt-btn:hover:not(:disabled) { background: #eff6ff; border-color: #93c5fd; }
.opt-btn.correct { background: #f0fdf4; border-color: #86efac; color: #166534; }
.opt-btn.wrong { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
.fill-input {
  width: 100%;
  border: 1px solid #e9e9e7;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: inherit;
  color: #37352f;
  outline: none;
  transition: border-color .15s;
  margin-bottom: 8px;
}
.fill-input:focus { border-color: #0ea5e9; }
.fill-input.correct { border-color: #86efac; background: #f0fdf4; }
.fill-input.wrong { border-color: #fca5a5; background: #fef2f2; }
.btn-submit {
  background: #0ea5e9;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.btn-submit:hover { background: #0284c7; }
.btn-submit:disabled { background: #e9e9e7; color: #9b9a97; cursor: default; }
.quiz-explanation {
  display: none;
  margin-top: 12px;
  padding: 10px 14px;
  background: #f7f6f3;
  border-radius: 6px;
  font-size: 13px;
  color: #37352f;
  line-height: 1.6;
}
.quiz-explanation.show { display: block; }
.expl-label { font-weight: 700; color: #0ea5e9; }
.hint-text { font-size: 12px; color: #9b9a97; margin-bottom: 6px; }
.progress-bar-wrap {
  background: #f1f0ef;
  border-radius: 4px;
  height: 6px;
  margin-bottom: 24px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #0ea5e9, #6366f1);
  border-radius: 4px;
  transition: width .4s ease;
}
.finish-banner {
  display: none;
  text-align: center;
  padding: 28px;
  border: 2px solid #86efac;
  border-radius: 12px;
  background: #f0fdf4;
  margin-bottom: 24px;
}
.finish-banner.show { display: block; }
.finish-emoji { font-size: 40px; margin-bottom: 8px; }
.finish-title { font-size: 18px; font-weight: 700; color: #166534; margin-bottom: 4px; }
.finish-sub { font-size: 14px; color: #4ade80; }
.vocab-done-wrap {
  text-align: center;
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid #e9e9e7;
}
.btn-vocab-done {
  padding: 12px 36px;
  font-size: 15px;
  font-weight: 700;
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  color: #fff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-vocab-done:hover { opacity: .9; }
.btn-vocab-done.done {
  background: #f0fdf4;
  color: #166534;
  border: 2px solid #86efac;
  cursor: default;
}
@media (max-width: 500px) {
  .page { padding: 32px 16px 60px; }
  .page-title { font-size: 24px; }
}
</style>
</head>

<div class="cover"></div>
<div class="page">

  <a class="back-link" href="../index.html">← Yong's AI Study</a>

    <button class="tab-btn active" onclick="switchTab('vocab', this)">📚 배운 표현</button>

      <button class="btn-reset" onclick="resetQuiz()">다시하기</button>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="quiz-list" id="quizList"></div>
  </div>

</div>

<script>
const WORDS = [{"word": "candescent", "part_of_speech": "adjective", "meaning_ko": "빛나는, 백열의", "explanation": "glowing or shining brightly, especially when heated to incandescence", "example_from_convo": "The candescent light from the old lamp filled the room", "example_ko": "오래된 램프에서 나오는 백열의 빛이 방을 가득 채웠다", "tip": "candescent bulb(백열전구)라는 표현으로도 자주 사용됨", "emoji": "💡"}, {"word": "paucity", "part_of_speech": "noun", "meaning_ko": "부족, 결핍", "explanation": "the state of being scarce or in short supply; a small or insufficient quantity", "example_from_convo": "There's a paucity of affordable housing in the city", "example_ko": "도시에 저렴한 주택이 부족하다", "tip": "formal한 표현으로 학문적 글쓰기에서 자주 나타남", "emoji": "📉"}, {"word": "ebullient", "part_of_speech": "adjective", "meaning_ko": "열정적인, 흥분된", "explanation": "cheerful, enthusiastic, and full of energy; effusively excited", "example_from_convo": "She gave an ebullient speech that inspired everyone in the audience", "example_ko": "그녀는 청중 모두를 영감으로 가득 채운 열정적인 연설을 했다", "tip": "긍정적인 감정을 표현할 때 사용하며, 단순한 happy보다 훨씬 강력함", "emoji": "🎉"}, {"word": "assuage", "part_of_speech": "verb", "meaning_ko": "진정시키다, 완화시키다", "explanation": "to calm or pacify someone; to make something less severe or intense", "example_from_convo": "A warm cup of tea assuaged her anxiety about the exam", "example_ko": "따뜻한 차 한 잔이 시험에 대한 불안감을 진정시켰다", "tip": "soothe나 calm보다 더 formal하며, 고통이나 걱정을 덜어줄 때 사용", "emoji": "🧘"}, {"word": "perspicacious", "part_of_speech": "adjective", "meaning_ko": "통찰력 있는, 예리한", "explanation": "having keen insight, discernment, or understanding; mentally sharp and penetrating", "example_from_convo": "Her perspicacious analysis revealed problems no one else noticed", "example_ko": "그녀의 예리한 분석은 다른 사람들이 눈치채지 못한 문제들을 드러냈다", "tip": "지능적이고 통찰력 있는 사람이나 관찰을 칭찬할 때 사용하는 sophisticated word", "emoji": "🧠"}];
const QUIZ  = [{"type": "meaning", "word": "paucity", "question": "What does 'paucity' mean?", "options": ["An abundance or large quantity of something", "A scarcity or insufficiency of something", "A mixture of different elements", "A period of rapid growth"], "answer": 1, "explanation": "'Paucity' means scarcity or insufficiency—when there is not enough of something."}, {"type": "meaning", "word": "ebullient", "question": "Which of the following best describes an 'ebullient' person?", "options": ["Someone who is shy and withdrawn", "Someone who is cheerful, enthusiastic, and full of energy", "Someone who is skeptical and doubtful", "Someone who is calm and reserved"], "answer": 1, "explanation": "Ebullient describes someone who is enthusiastic, energetic, and bursting with excitement."}, {"type": "meaning", "word": "perspicacious", "question": "What is a synonym for 'perspicacious'?", "options": ["Insightful and sharp-minded", "Physically strong", "Highly emotional", "Completely transparent"], "answer": 0, "explanation": "Perspicacious means having keen insight and sharp understanding; it describes someone with excellent perception."}, {"type": "fill_blank", "word": "assuage", "question": "The mother tried to _______ her child's fears about the first day of school with comforting words.", "options": ["assuage", "amplify", "ignore", "exacerbate"], "answer": 0, "explanation": "To assuage means to calm or pacify, which is exactly what the mother is doing to reduce her child's fears."}, {"type": "fill_blank", "word": "candescent", "question": "The _______ glow of the streetlights created a warm atmosphere on the winter evening.", "options": ["dim", "candescent", "invisible", "harsh"], "answer": 1, "explanation": "Candescent refers to a bright, glowing light, which fits perfectly for describing streetlights creating a warm atmosphere."}, {"type": "fill_blank", "word": "paucity", "question": "Due to the _______ of evidence, the defendant could not be convicted.", "options": ["abundance", "paucity", "complexity", "presentation"], "answer": 1, "explanation": "Paucity means scarcity or insufficient amount, which makes sense in a legal context where lack of evidence is crucial."}, {"type": "situation", "word": "ebullient", "question": "Your friend just got accepted to their dream university and can't stop jumping and celebrating. How would you describe their mood?", "options": ["She seems cautious and reserved", "She is being ebullient about the news", "She appears disappointed but hiding it", "She is showing mixed feelings"], "answer": 1, "explanation": "An ebullient mood means someone is extremely cheerful and enthusiastic, which perfectly describes someone celebrating getting into their dream school."}, {"type": "situation", "word": "perspicacious", "question": "During a business meeting, a colleague notices a subtle flaw in the marketing strategy that everyone else missed, and their observation turns out to be crucial. What quality is this colleague demonstrating?", "options": ["Blind luck", "Perspicacious insight", "Random guessing", "Basic common sense"], "answer": 1, "explanation": "Perspicacious means having keen insight and sharp discernment—the colleague demonstrated this by noticing something subtle that others overlooked."}];

/* ── 탭 전환 ── */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

/* ── 단어 카드 그라디언트 ── */
function wordGradient(pos) {
  const p = (pos || '').toLowerCase();
  if (p.includes('슬랭') || p.includes('slang') || p.includes('구동사'))
    return 'linear-gradient(135deg,#7c3aed,#4f46e5)';
  if (p.includes('동사') || p.includes('verb'))
    return 'linear-gradient(135deg,#0ea5e9,#2563eb)';
  if (p.includes('형용사') || p.includes('adj'))
    return 'linear-gradient(135deg,#10b981,#059669)';
  if (p.includes('명사') || p.includes('noun'))
    return 'linear-gradient(135deg,#f59e0b,#dc2626)';
  if (p.includes('관용') || p.includes('idiom') || p.includes('표현'))
    return 'linear-gradient(135deg,#ec4899,#8b5cf6)';
  if (p.includes('부사'))
    return 'linear-gradient(135deg,#06b6d4,#0284c7)';
  return 'linear-gradient(135deg,#6366f1,#8b5cf6)';
}

/* ── 단어 탭 렌더 ── */
function renderWords() {
  const list = document.getElementById('wordList');
  list.innerHTML = WORDS.map((w, i) => `
    <div class="word-card">
      <div class="word-header">
        <span class="word-text">${w.word}</span>
        <span class="word-pos">${w.part_of_speech}</span>
      </div>
      <div class="word-meaning">${w.meaning_ko}</div>
      <div class="word-explanation">${w.explanation}</div>
      ${w.example_from_convo ? `
      <div class="example-box">
        <div class="example-en">"${w.example_from_convo}"</div>
        <div class="example-ko">${w.example_ko}</div>
      </div>` : ''}
      ${w.tip ? `
      <div class="tip-box">
        <span class="tip-label">💡 Tip</span>${w.tip}
      </div>` : ''}
      ${w.emoji ? `
      <div class="word-illus" style="background:${wordGradient(w.part_of_speech)}">
        <span class="word-illus-emoji">${w.emoji}</span>
        <div class="word-illus-en">${w.word}</div>
        <div class="word-illus-ko">${w.meaning_ko}</div>
      </div>` : ''}
    </div>
  `).join('');
}

/* ── 퀴즈 탭 렌더 ── */
let score = 0;
let answered = 0;

function renderQuiz() {
  document.getElementById('totalDisplay').textContent = QUIZ.length;
  const list = document.getElementById('quizList');
  list.innerHTML = QUIZ.map((q, i) => buildQuizCard(q, i)).join('');
}

function buildQuizCard(q, i) {
  const typeLabel = { meaning: '의미 퀴즈', fill_blank: '빈칸 채우기', situation: '상황 퀴즈' }[q.type] || q.type;
  const wordBadge = q.word ? `<span class="quiz-word-badge">${q.word}</span><br>` : '';
  const wd = WORDS.find(w => w.word === q.word);
  const illustHtml = (wd && wd.emoji) ? `
    <div class="quiz-illus" style="background:${wordGradient(wd.part_of_speech)};margin-bottom:10px">
      <span style="font-size:36px">${wd.emoji}</span>
      <div style="font-size:15px;font-weight:800;color:white;margin-top:5px;text-shadow:0 1px 3px rgba(0,0,0,.2)">${wd.word}</div>
      <div style="font-size:12px;color:rgba(255,255,255,.85)">${wd.meaning_ko}</div>
    </div>` : '';

  if (q.type === 'fill_blank') {
    return `
    <div class="quiz-card" id="qcard-${i}">
      <div class="quiz-type-badge">${typeLabel}</div>
      ${wordBadge}
      <div class="quiz-question">${q.sentence}</div>
      ${q.sentence_ko ? `<div class="hint-text">${q.sentence_ko}</div>` : ''}
      <div class="hint-text">힌트: ${q.hint}</div>
      <input class="fill-input" id="fill-${i}" placeholder="답을 입력하세요" onkeydown="if(event.key==='Enter') submitFill(${i})">
      <button class="btn-submit" id="fill-btn-${i}" onclick="submitFill(${i})">제출</button>
      <div class="quiz-explanation" id="expl-${i}">
        ${illustHtml}
        <span class="expl-label">정답: </span>${q.answer}
      </div>
    </div>`;
  }

  const opts = (q.options || []).map((opt, j) =>
    `<button class="opt-btn" id="opt-${i}-${j}" onclick="selectOpt(${i}, ${j}, ${q.answer})">${String.fromCharCode(65+j)}. ${opt}</button>`
  ).join('');

  return `
  <div class="quiz-card" id="qcard-${i}">
    <div class="quiz-type-badge">${typeLabel}</div>
    ${wordBadge}
    <div class="quiz-question">${q.question}</div>
    <div class="quiz-options">${opts}</div>
    <div class="quiz-explanation" id="expl-${i}">
      ${illustHtml}
      <span class="expl-label">💬 </span>${q.explanation || ''}
    </div>
  </div>`;
}

function selectOpt(qi, chosen, correct) {
  const card = document.getElementById('qcard-' + qi);
  if (card.classList.contains('answered')) return;
  card.classList.add('answered');
  answered++;

  const opts = card.querySelectorAll('.opt-btn');
  opts.forEach(b => b.disabled = true);
  opts[correct].classList.add('correct');
  if (chosen !== correct) opts[chosen].classList.add('wrong');
  else { score++; document.getElementById('scoreDisplay').textContent = score; }

  document.getElementById('expl-' + qi).classList.add('show');
  updateProgress();
}

function submitFill(qi) {
  const inp = document.getElementById('fill-' + qi);
  const btn = document.getElementById('fill-btn-' + qi);
  const card = document.getElementById('qcard-' + qi);
  if (card.classList.contains('answered')) return;

  const userAns = inp.value.trim().toLowerCase();
  const correct = QUIZ[qi].answer.toLowerCase();
  card.classList.add('answered');
  answered++;
  inp.disabled = true;
  btn.disabled = true;

  if (userAns === correct) { inp.classList.add('correct'); score++; document.getElementById('scoreDisplay').textContent = score; }
  else { inp.classList.add('wrong'); }

  document.getElementById('expl-' + qi).classList.add('show');
  updateProgress();
}

function updateProgress() {
  const pct = QUIZ.length ? (answered / QUIZ.length * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  if (answered === QUIZ.length) showFinish();
}

function showFinish() {
  const banner = document.getElementById('finishBanner');
  const wrong = answered - score;
  const pct = Math.round(score / QUIZ.length * 100);
  document.getElementById('finishEmoji').textContent = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '📖';
  document.getElementById('finishTitle').textContent = pct >= 80 ? '완벽해요!' : pct >= 50 ? '잘하고 있어요!' : '계속 연습하면 돼요!';
  document.getElementById('finishSub').textContent = '오늘 배운 표현들 퀴즈 완료!';
  document.getElementById('finishCorrect').textContent = score;
  document.getElementById('finishWrong').textContent = wrong;
  document.getElementById('finishAccuracy').textContent = pct + '%';
  banner.classList.add('show');
  banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
  localStorage.setItem('english_quiz_done', TODAY_DATE);
}

function resetQuiz() {
  score = 0;
  answered = 0;
  document.getElementById('scoreDisplay').textContent = 0;
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('finishBanner').classList.remove('show');
  renderQuiz();
}

renderWords();
renderQuiz();

const TODAY_DATE = (()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
function markVocabDone() {
  localStorage.setItem('english_vocab_read', TODAY_DATE);
  const btn = document.getElementById('btnVocabDone');
  btn.textContent = '✅ 오늘 완료!';
  btn.className = 'btn-vocab-done done';
  btn.disabled = true;
}
(function() {
  if (localStorage.getItem('english_vocab_read') === TODAY_DATE) {
    const btn = document.getElementById('btnVocabDone');
    btn.textContent = '✅ 오늘 완료!';
    btn.className = 'btn-vocab-done done';
    btn.disabled = true;
  }
})();
</script>
