}
.tab-btn.active { color: #37352f; border-bottom-color: #37352f; }
.tab-btn:hover:not(.active) { color: #37352f; }

.tab-panel { display: none; }
.tab-panel.active { display: block; animation: tabIn .2s ease; }
@keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.word-list { display: flex; flex-direction: column; gap: 16px; }

}
.word-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.08); }
.word-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.word-text {

  font-weight: 700;
  color: #37352f;
}
.word-pos {

}
.word-meaning {

  font-weight: 600;

}

.example-en { font-size: 14px; font-style: italic; color: #37352f; margin-bottom: 3px; }
.example-ko { font-size: 12px; color: #9b9a97; }
.tip-box {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 13px;
  color: #92400e;
  margin-bottom: 12px;
}
.tip-label { font-weight: 700; margin-right: 4px; }
.word-illus {
  border-radius: 14px;
  padding: 24px 20px;
  text-align: center;
  margin-top: 14px;
}
.word-illus-emoji {
  font-size: 54px;
  display: block;
  margin-bottom: 8px;
}
.word-illus-en {
  font-size: 20px;
  font-weight: 800;
  color: white;
  margin-bottom: 4px;

@media (max-width: 500px) {

<script>
const WORDS = [{"word": "compelling", "part_of_speech": "형용사", "meaning_ko": "강렬한, 설득력 있는, 매력적인", "explanation": "논증이나 증거가 매우 설득력 있어서 사람들의 주의를 끌거나 동의를 유도하는 상태. TOEFL Reading의 학술 지문과 Writing 고빈출 어휘입니다.", "example_from_convo": "The researcher presented a compelling argument that ocean acidification threatens marine ecosystems.", "example_ko": "연구원은 해양 산성화가 해양 생태계를 위협한다는 강력한 논거를 제시했어요.", "tip": "동의어: persuasive(설득력 있는), convincing(납득시키는), compelling. 반의어: unconvincing(설득력 없는), weak(약한). Reading·Writing·Speaking 고빈출.", "emoji": "💪"}, {"word": "attribute", "part_of_speech": "동사/명사", "meaning_ko": "~의 원인이라고 보다, 돌리다 (동사) / 특성, 속성 (명사)", "explanation": "어떤 결과나 특성이 특정한 원인이나 출처에서 비롯되었다고 생각하거나 말하는 것. TOEFL Reading에서 '~을 ~에 돌리다', '~때문이라고 생각하다'의 의미로 자주 출제됩니다.", "example_from_convo": "Scientists attribute the extinction of dinosaurs to a massive meteor impact.", "example_ko": "과학자들은 공룡의 멸종을 거대한 운석 충돌 탓이라고 봐요.", "tip": "동사: attribute A to B (A를 B에 돌리다). 명사: key attributes(핵심 특성). 동의어: ascribe(귀속시키다), trace(추적하다). Reading·Listening에서 인과관계 파악할 때 필수.", "emoji": "🔍"}, {"word": "preliminary", "part_of_speech": "형용사", "meaning_ko": "예비적인, 사전 단계의, 초기의", "explanation": "본격적인 진행 전 준비 단계나 초기 단계를 나타내는 말. '~한 조사', '~한 회의' 등으로 쓰여 최종 결과가 아님을 암시합니다.", "example_from_convo": "Preliminary results suggest that the new vaccine is 85% effective against the virus.", "example_ko": "예비 결과에 따르면 새로운 백신이 바이러스에 대해 85% 효과가 있어요.", "tip": "동의어: initial(초기의), preparatory(준비적인). 반의어: final(최종적인), conclusive(결론적인). 'preliminary report'·'preliminary study' 자주 등장. Reading·Listening 고빈출.", "emoji": "🔮"}, {"word": "coincide", "part_of_speech": "동사", "meaning_ko": "일치하다, 동시에 발생하다, 겹치다", "explanation": "두 개 이상의 사건이나 시간이 같은 시점에 일어나거나, 견해나 의견이 정확하게 같을 때 사용합니다.", "example_from_convo": "The rise in carbon dioxide levels coincides with increased industrial activity.", "example_ko": "이산화탄소 수준의 상승은 증가된 산업 활동과 일치해요.", "tip": "동사 coincide with (함께 일어나다). 동의어: occur simultaneously(동시에 발생), align(일렬로 서다). Reading·Listening에서 인과관계·상관관계 파악에 중요. 'coincidence'(우연)와 구분.", "emoji": "⏰"}, {"word": "substantial", "part_of_speech": "형용사", "meaning_ko": "상당한, 상실할 만한, 실질적인", "explanation": "양, 규모, 정도가 충분히 크거나 많다는 뜻. '무시할 수 없는 정도의', '의미 있는' 정도를 나타냅니다.", "example_from_convo": "The study revealed a substantial increase in student engagement after implementing interactive learning methods.", "example_ko": "연구에 따르면 상호작용식 학습 방식을 도입한 후 학생 참여도가 상당히 증가했어요.", "tip": "동의어: significant(의미 있는), considerable(상당한), substantial. 반의어: negligible(무시할 만한), trivial(하찮은). 'substantial evidence'·'substantial change' 자주 사용. Reading·Writing 고빈출.", "emoji": "📊"}];
const QUIZ  = [{"type": "meaning", "word": "compelling", "question": "Which of the following best describes 'compelling'?", "options": ["persuasive and able to convince or interest people", "vague and open to multiple interpretations", "confusing and difficult to understand", "brief and to the point"], "answer": 0, "explanation": "compelling은 강력한 설득력을 가진 논거나 주장을 뜻합니다.", "option_explanations": [null, "ambiguous(모호한)의 의미로 compelling과는 정반대입니다.", "confusing(혼란스러운)은 compelling의 뜻이 아니에요.", "brief(간결한)는 compelling과 무관한 특성입니다."]}, {"type": "meaning", "word": "attribute", "question": "What does it mean to 'attribute something to a cause'?", "options": ["to consider something as being caused by that factor", "to separate something into smaller parts", "to add more features to something", "to delay or postpone action"], "answer": 0, "explanation": "'attribute A to B'는 A의 원인이 B라고 생각하는 것입니다.", "option_explanations": [null, "분해(separate)는 attribute의 의미가 아닙니다.", "add(추가)는 관련 없는 의미예요.", "delay(지연)는 완전히 다른 의미입니다."]}, {"type": "meaning", "word": "coincide", "question": "Which best explains 'coincide'?", "options": ["to happen at the same time or correspond exactly", "to prevent something from occurring", "to gradually fade away over time", "to react in strong opposition"], "answer": 0, "explanation": "coincide는 두 사건이나 시간이 정확하게 같은 시점에 일어나거나 일치하는 것을 의미합니다.", "option_explanations": [null, "prevent(방지)는 coincide와 반대 의미입니다.", "fade away(사라지다)는 시간 경과의 의미이지 coincide가 아닙니다.", "react in opposition(반대로 반응)은 coincide의 뜻이 아니에요."]}, {"type": "fill_blank", "word": "compelling", "sentence": "The documentary presented _____ evidence that changed many people's views on climate policy.", "sentence_ko": "그 다큐멘터리는 많은 사람들의 기후 정책 관점을 바꾼 설득력 있는 증거를 제시했어요.", "answer": "compelling", "hint": "persuasive, convincing"}, {"type": "fill_blank", "word": "preliminary", "sentence": "The _____ findings of the experiment are promising, but we need to conduct further research.", "sentence_ko": "그 실험의 예비 결과는 유망해 보이지만 추가 /* ── 탭 전환 ── */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

/* ── 단어 카드 그라디언트 ── */
function wordGradient(pos) {
  const p = (pos || '').toLowerCase();
  if (p.includes('슬랭') || p.includes('slang') || p.includes('구동사'))
    return 'linear-gradient(135deg,#7c3aed,#4f46e5)';
  if (p.includes('동사') || p.includes('verb'))
    return 'linear-gradient(135deg,#0ea5e9,#2563eb)';
  if (p.includes('형용사') || p.includes('adj'))
    return 'linear-gradient(135deg,#10b981,#059669)';
  if (p.includes('명사') || p.includes('noun'))
    return 'linear-gradient(135deg,#f59e0b,#dc2626)';
  if (p.includes('관용') || p.includes('idiom') || p.includes('표현'))
    return 'linear-gradient(135deg,#ec4899,#8b5cf6)';
  if (p.includes('부사'))
    return 'linear-gradient(135deg,#06b6d4,#0284c7)';
  return 'linear-gradient(135deg,#6366f1,#8b5cf6)';
}

/* ── 단어 탭 렌더 ── */
function renderWords() {
  const list = document.getElementById('wordList');
  list.innerHTML = WORDS.map((w, i) => `
    <div class="word-card">
      <div class="word-header">
        <span class="word-text">${w.word}</span>
        <span class="word-pos">${w.part_of_speech}</span>
      </div>
      <div class="word-meaning">${w.meaning_ko}</div>
      <div class="word-explanation">${w.explanation}</div>
      ${w.example_from_convo ? `
      <div class="example-box">
        <div class="example-en">"${w.example_from_convo}"</div>
        <div class="example-ko">${w.example_ko}</div>
      </div>` : ''}
      ${w.tip ? `
      <div class="tip-box">
        <span class="tip-label">💡 Tip</span>${w.tip}
      </div>` : ''}
      ${w.emoji ? `
      <div class="word-illus" style="background:${wordGradient(w.part_of_speech)}">
        <span class="word-illus-emoji">${w.emoji}</span>
        <div class="word-illus-en">${w.word}</div>
        <div class="word-illus-ko">${w.meaning_ko}</div>
      </div>` : ''}
    </div>
  `).join('');
}

/* ── 퀴즈 탭 렌더 ── */
let score = 0;
let answered = 0;

function renderQuiz() {
  document.getElementById('totalDisplay').textContent = QUIZ.length;
  const list = document.getElementById('quizList');
  list.innerHTML = QUIZ.map((q, i) => buildQuizCard(q, i)).join('');
}

function buildQuizCard(q, i) {
  const typeLabel = { meaning: '의미 퀴즈', fill_blank: '빈칸 채우기', situation: '상황 퀴즈' }[q.type] || q.type;
  const wordBadge = q.word ? `<span class="quiz-word-badge">${q.word}</span><br>` : '';
  const wd = WORDS.find(w => w.word === q.word);
  const illustHtml = (wd && wd.emoji) ? `
    <div class="quiz-illus" style="background:${wordGradient(wd.part_of_speech)};margin-bottom:10px">
      <span style="font-size:36px">${wd.emoji}</span>
      <div style="font-size:15px;font-weight:800;color:white;margin-top:5px;text-shadow:0 1px 3px rgba(0,0,0,.2)">${wd.word}</div>
      <div style="font-size:12px;color:rgba(255,255,255,.85)">${wd.meaning_ko}</div>
    </div>` : '';

  if (q.type === 'fill_blank') {
    return `
    <div class="quiz-card" id="qcard-${i}">
      <div class="quiz-type-badge">${typeLabel}</div>
      ${wordBadge}
      <div class="quiz-question">${q.sentence}</div>
      ${q.sentence_ko ? `<div class="hint-text">${q.sentence_ko}</div>` : ''}
      <div class="hint-text">힌트: ${q.hint}</div>
      <input class="fill-input" id="fill-${i}" placeholder="답을 입력하세요" onkeydown="if(event.key==='Enter') submitFill(${i})">
      <button class="btn-submit" id="fill-btn-${i}" onclick="submitFill(${i})">제출</button>
      <div class="quiz-explanation" id="expl-${i}">
        ${illustHtml}
        <span class="expl-label">정답: </span>${q.answer}
      </div>
    </div>`;
  }

  const opts = (q.options || []).map((opt, j) =>
    `<button class="opt-btn" id="opt-${i}-${j}" onclick="selectOpt(${i}, ${j}, ${q.answer})">${String.fromCharCode(65+j)}. ${opt}</button>`
  ).join('');

  return `
  <div class="quiz-card" id="qcard-${i}">
    <div class="quiz-type-badge">${typeLabel}</div>
    ${wordBadge}
    <div class="quiz-question">${q.question}</div>
    <div class="quiz-options">${opts}</div>
    <div class="quiz-explanation" id="expl-${i}">
      ${illustHtml}
      <span class="expl-label">💬 </span>${q.explanation || ''}
    </div>
  </div>`;
}

function selectOpt(qi, chosen, correct) {
  const card = document.getElementById('qcard-' + qi);
  if (card.classList.contains('answered')) return;
  card.classList.add('answered');
  answered++;

  const opts = card.querySelectorAll('.opt-btn');
  opts.forEach(b => b.disabled = true);
  opts[correct].classList.add('correct');
  if (chosen !== correct) opts[chosen].classList.add('wrong');
  else { score++; document.getElementById('scoreDisplay').textContent = score; }

  document.getElementById('expl-' + qi).classList.add('show');
  updateProgress();
}

function submitFill(qi) {
  const inp = document.getElementById('fill-' + qi);
  const btn = document.getElementById('fill-btn-' + qi);
  const card = document.getElementById('qcard-' + qi);
  if (card.classList.contains('answered')) return;

  const userAns = inp.value.trim().toLowerCase();
  const correct = QUIZ[qi].answer.toLowerCase();
  card.classList.add('answered');
  answered++;
  inp.disabled = true;
  btn.disabled = true;

  if (userAns === correct) { inp.classList.add('correct'); score++; document.getElementById('scoreDisplay').textContent = score; }
  else { inp.classList.add('wrong'); }

  document.getElementById('expl-' + qi).classList.add('show');
  updateProgress();
}

function updateProgress() {
  const pct = QUIZ.length ? (answered / QUIZ.length * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  if (answered === QUIZ.length) showFinish();
}

function showFinish() {
  const banner = document.getElementById('finishBanner');
  const wrong = answered - score;
  const pct = Math.round(score / QUIZ.length * 100);
  document.getElementById('finishEmoji').textContent = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '📖';
  document.getElementById('finishTitle').textContent = pct >= 80 ? '완벽해요!' : pct >= 50 ? '잘하고 있어요!' : '계속 연습하면 돼요!';
  document.getElementById('finishSub').textContent = '오늘 배운 표현들 퀴즈 완료!';
  document.getElementById('finishCorrect').textContent = score;
  document.getElementById('finishWrong').textContent = wrong;
  document.getElementById('finishAccuracy').textContent = pct + '%';
  banner.classList.add('show');
  banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
  localStorage.setItem('english_quiz_done', TODAY_DATE);
}

function resetQuiz() {
  score = 0;
  answered = 0;
  document.getElementById('scoreDisplay').textContent = 0;
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('finishBanner').classList.remove('show');
  renderQuiz();
}

renderWords();
renderQuiz();

const TODAY_DATE = (()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
function markVocabDone() {
  localStorage.setItem('english_vocab_read', TODAY_DATE);
  const btn = document.getElementById('btnVocabDone');
  btn.textContent = '✅ 오늘 완료!';
  btn.className = 'btn-vocab-done done';
  btn.disabled = true;
}
(function() {
  if (localStorage.getItem('english_vocab_read') === TODAY_DATE) {
    const btn = document.getElementById('btnVocabDone');
    btn.textContent = '✅ 오늘 완료!';
    btn.className = 'btn-vocab-done done';
    btn.disabled = true;
  }
})();
</script>
